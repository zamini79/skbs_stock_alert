name: 주가 변동 감지 (SK바이오사이언스 302440)

# 실행 트리거는 workflow_dispatch 하나뿐이다.
# - 외부 cron-job.org 가 5분마다 API로 dispatch 한다(시간 제한 없음). 장 시간 판정은 코드 가드가 전담.
# - GitHub schedule 트리거는 두지 않는다: 공개 저장소는 60일간 push 가 없으면 schedule 워크플로를
#   통째로 비활성화하고(이 경우 dispatch 도 막힘), 실측상 하루 3회 남짓만 지연 실행돼 백업 가치도 없었다.
# - Actions 탭에서 수동 실행도 가능(테스트용).
on:
  workflow_dispatch:

# concurrency 그룹은 두지 않는다: GitHub 러너 백로그(러너 배정 지연) 시 5분마다 오는 트리거가
# pending 큐에 쌓이면서 서로를 취소해 'All jobs were cancelled' 메일이 무더기로 발송됐다(실측: 야간 45건).
# 중복 발송은 상태 파일(하루 1회)과 장시간 가드가 막으므로 concurrency 없이도 안전하다.

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      # 발송 쿨다운(하루 최대 2회·단계별 1회) 상태 파일을 실행 간 보존.
      # ⚠️ actions/cache 키는 immutable(한 번 생기면 갱신 안 됨)이라, 고정 키를 쓰면
      #    같은 날 보고를 보내도 상태가 저장되지 않아 다음 실행이 중복 발송한다(실측).
      #    → 매 실행 '고유 키'로 새로 저장하고, restore-keys 접두사로 '오늘 최신' 상태를 복원한다.
      - name: 오늘 날짜(KST) 산출
        id: date
        run: echo "today=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      - name: 보고 상태 파일 캐시 (매 실행 새 키 저장 + 오늘 최신 복원)
        uses: actions/cache@v4
        with:
          path: ~/.stock_alert_302440_state.json
          key: stock-alert-state-${{ steps.date.outputs.today }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stock-alert-state-${{ steps.date.outputs.today }}-

      - name: 주가 감지 → (조건 충족 시) 보고
        env:
          TZ: Asia/Seoul   # 로그 시각·날짜(date.today)를 KST로 — 캐시 키와 동일 기준
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DART_CORP_CODE: ${{ secrets.DART_CORP_CODE }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 stock_alert_302440.py
